# The public test server at https://apron.farfield.systems, behind Caddy and
# a Cloudflare Tunnel. Deploy with tools/deploy/deploy.sh.
name: apron
services:
  aprond:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: apron-aprond:latest
    restart: unless-stopped
    ports:
      # The reverse proxy reaches aprond at host.docker.internal, the docker
      # bridge gateway, so the port binds there and nowhere public.
      - "172.17.0.1:8901:8080"
    volumes:
      - data:/data
    command:
      - --addr=0.0.0.0:8080
      - --store=sqlite:/data/aprond.db
      - --upload.dir=/data/uploads
      - --static-dir=/web
      - --public-url=https://apron.farfield.systems
      - --origin=https://apron.farfield.systems
      - --webauthn.rp-id=apron.farfield.systems
      - --webauthn.origin=https://apron.farfield.systems
      - --apple.app-id=MP92RCAPRG.app.ladle.ios
      # Caddy appends cloudflared's loopback address to X-Forwarded-For, so
      # its last entry is 127.0.0.1 for every visitor. Cloudflare sets
      # Cf-Connecting-IP to the visitor alone and Caddy passes it through.
      - --client-ip-header=Cf-Connecting-IP
      - --messages-per-minute=30
      - --max-connections=300
      - --max-listener-connections=600
      - --max-private-rooms=20
volumes:
  data:
