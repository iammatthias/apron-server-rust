# The public test server at https://apron.farfield.systems, behind Caddy and
# a Cloudflare Tunnel. Deploy with tools/deploy/deploy.sh.
# The router sends aprond's paths to aprond and the rest to web, which serves
# a build of apron-web.
name: apron
services:
  aprond:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: apron-aprond:latest
    restart: unless-stopped
    volumes:
      - data:/data
      # Kept outside the bundle, which rsync --delete replaces; deploy.sh
      # makes it on the host when it is missing.
      - ${APRON_SECRETS_DIR:?set by deploy.sh}/admin_token:/run/secrets/apron_admin_token:ro
    command:
      - --addr=0.0.0.0:8080
      - --store=sqlite:/data/aprond.db
      - --upload.dir=/data/uploads
      - --public-url=https://apron.farfield.systems
      - --origin=https://apron.farfield.systems
      - --webauthn.rp-id=apron.farfield.systems
      - --webauthn.origin=https://apron.farfield.systems
      - --apple.app-id=MP92RCAPRG.app.ladle.ios
      # X-Forwarded-For's last entry is a proxy's address for every visitor.
      # Cloudflare sets Cf-Connecting-IP to the visitor alone, and the host's
      # Caddy and the router pass it through.
      - --client-ip-header=Cf-Connecting-IP
      - --max-connections=300
      - --max-listener-connections=600
      - --max-private-rooms=20
      # The owner's account, renamed from guest_1 by /rename. A grant is given
      # once, so this only records who it went to.
      - --role=admin=matthias
      - --history.retention=168h
      - --welcome=Guests can read along. Create a passkey to post, react and start threads. Messages are kept for 7 days.
      - --admin-token-file=/run/secrets/apron_admin_token
      - --server.title=Apron Rust test server
      - --server.description=A test deployment of apron-server-rust, for the Ladle iOS client.
  web:
    build:
      context: .
      dockerfile: caddy.Dockerfile
      target: web
    image: apron-web:latest
    restart: unless-stopped
  router:
    build:
      context: .
      dockerfile: caddy.Dockerfile
      target: router
    image: apron-router:latest
    restart: unless-stopped
    depends_on: [aprond, web]
    ports:
      # The reverse proxy reaches the router at host.docker.internal, the
      # docker bridge gateway, so the port binds there and nowhere public.
      - "${APRON_PUBLISH:-172.17.0.1:8901}:8080"
volumes:
  data:
